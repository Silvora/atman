# medium 模型配置。数据和 Tokenizer 使用各自的独立配置。
# 配置格式版本；当前训练入口只接受 1。
schema_version: 1

profile:
  # 输出目录、日志和实验记录使用该名称。
  name: medium
  # 当前配置用于基础预训练，后续阶段应使用独立配置。
  stage: pretraining

architecture:
  family: dense_decoder
  attention: gqa
  position_encoding: rope
  normalization: rmsnorm
  feed_forward: swiglu
  target_context_length: 32768
  extension_context_length: 131072

model:
  vocab_size: 16384       # 必须与正式 Tokenizer 词表一致。
  max_seq_len: 2048      # 必须与编码数据的序列长度一致。
  d_model: 768            # 隐藏维度。
  n_layers: 12             # Transformer 层数。
  n_heads: 12              # 注意力头数，768 可被 12 整除。
  ffn_dim: 3072            # 前馈层中间维度。
  dropout: 0.0             # 基础预训练默认关闭。
  bias: true               # 保留 bias，结构更接近早期 GPT。
  tie_embeddings: true     # 共享输入输出词嵌入权重。

data_config: data.yaml     # 相对 configs/ 解析。

training:
  output_dir: outputs/medium
  seed: 42
  epochs: 1
  max_steps: 0
  batch_size: 1             # medium 单卡默认 micro batch；可用累积提高有效 batch。
  gradient_accumulation_steps: 16
  learning_rate: 0.0003
  min_learning_rate: 0.00003
  warmup_ratio: 0.01
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  adam_eps: 0.00000001
  max_grad_norm: 1.0
  precision: bf16
  num_workers: 4
  pin_memory: true
  drop_last: true
  log_every_steps: 10
  eval_every_steps: 500
  eval_batches: 100
  save_every_steps: 500
  resume: null
